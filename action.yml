name: 'Install AutoHotkey'
description: 'Downloads and installs AutoHotkey and adds it to PATH'
author: 'Tao Beloney'

inputs:
  version:
    description: 'Version of AutoHotkey to install (e.g. 2.0.19 or "latest")'
    required: false
    default: 'latest'
  destination:
    description: 'Directory to install AutoHotkey into (defaults to current working directory)'
    required: false
    default: ''
  compiler:
    description: 'Version of the compiler to install, if any (e.g. "Ahk2Exe1.1.37.02a0a" or "latest")'
    required: false
    default: ''
  force-build:
    description: 'Always build 2.1+ from source, ignoring any cached build (no effect for 2.0 releases)'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The version of AutoHotkey that was actually installed'
    value: ${{ steps.installer.outputs.version }}
  ahk32:
    description: 'The full path to the installed AutoHotkey32.exe executable'
    value: ${{ steps.installer.outputs.ahk32 }}
  ahk64:
    description: 'The full path to the installed AutoHotkey64.exe executable'
    value: ${{ steps.installer.outputs.ahk64 }}
  ahk2Exe:
    description: 'The full path to the installed AutoHotkey compiler'
    value: ${{ steps.installer.outputs.ahk2Exe }}

runs:
  using: 'composite'
  steps:
    - name: Resolve version
      id: resolve
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $scriptPath = Join-Path ${{ github.action_path }} 'scripts/install-autohotkey.ps1'
        & $scriptPath -Version '${{ inputs.version }}' -ResolveOnly

    - name: Cache AutoHotkey build
      if: steps.resolve.outputs.is_source_build == 'true' && inputs.force-build != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/ahk-cache
        key: ahk-build-${{ runner.os }}-${{ steps.resolve.outputs.version }}

    - name: Run Installer
      id: installer
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $scriptPath = Join-Path ${{ github.action_path }} 'scripts/install-autohotkey.ps1'
        & $scriptPath -Version '${{ inputs.version }}' -Destination '${{ inputs.destination }}' -Compiler '${{ inputs.compiler }}' -CacheDir '${{ runner.temp }}/ahk-cache' -ForceBuild:$${{ inputs.force-build }}

branding:
  icon: 'terminal'
  color: 'green'
