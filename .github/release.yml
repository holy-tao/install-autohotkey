changelog:
  exclude:
    labels:
      - chore
      - ci
      - github_actions
      - ignore-for-release
  categories:
    - title: ⛓️‍💥 Breaking Changes
      labels:
        - breaking
    - title: 🚀 Enhancements
      labels:
        - enhancement
    - title: 🛠️ Fixes
      labels:
        - "*"
